name: Validate Gradle Wrapper

on:
  push:
    branches:
      - master
      - easy-keychain
  pull_request:
    branches:
      - master
      - easy-keychain

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
